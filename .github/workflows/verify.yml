name: Verify React and Node

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-http:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Install backend from lockfile
        run: npm ci
      - name: Check backend
        run: npm run check
      - name: Build backend and shared contract
        run: npm run build
      - name: Test backend permissions and persistence
        run: npm test
      - name: Smoke test built backend and backup
        run: npm run smoke
      - name: Install frontend from lockfile
        working-directory: frontend
        run: npm ci
      - name: Check frontend
        working-directory: frontend
        run: npm run check
      - name: Build production frontend
        working-directory: frontend
        run: npm run build
      - name: Verify production restrictions
        working-directory: frontend
        run: npm run test:config
      - name: Find runner browser
        run: |
          $browserPaths = @(
            'C:\Program Files\Google\Chrome\Application\chrome.exe',
            'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe'
          )
          $browserPath = $browserPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browserPath) { throw 'No supported runner browser found; set up the runner explicitly.' }
          "BROWSER_PATH=$browserPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify real loopback HTTP flow with synthetic data
        working-directory: frontend
        run: npm run test:integration
      - name: Verify explicit mock mode
        working-directory: frontend
        run: npm run test:mock
