<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演示学生签到</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/theme.css"><body class="student-body"><article class="student-card"><span class="eyebrow">CLASS IN SYNC / 演示</span><h1>课堂签到</h1><p>此页面仅供模拟签到测试，正式版将使用已登录学生身份，不能自行选择他人姓名。</p><label>模拟学生<select id="identity"></select></label><button class="primary" id="submit">确认演示签到</button><p id="result" role="status"></p></article><script type="module">const data=await fetch('/api/state').then(r=>r.json());for(const s of data.roster){let o=document.createElement('option');o.value=s.id;o.textContent=s.name;identity.append(o)}submit.onclick=async()=>{submit.disabled=true;try{let r=await fetch('/api/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentId:identity.value,ticket:new URLSearchParams(location.search).get('ticket')})});let d=await r.json();result.textContent=r.ok?'签到成功，你的拼图已归位。':d.error}catch{result.textContent='网络请求失败，请重试'}finally{submit.disabled=false}};</script></body></html>
